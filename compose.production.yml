name: bizora-production

services:
  web:
    build: .
    user: bizora
    command: >-
      sh -c 'python manage.py collectstatic --noinput && exec gunicorn
      --bind 0.0.0.0:8000 --workers 2 --access-logfile - bizora.wsgi:application'
    ports:
      - '127.0.0.1:18181:8000'
    env_file: .env.production
    environment:
      DJANGO_SETTINGS_MODULE: bizora.production_settings
      BIZORA_DATABASE: postgresql
      POSTGRES_HOST: db
      POSTGRES_PORT: '5432'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: pgvector/pgvector:0.8.7-pg16
    env_file: .env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
