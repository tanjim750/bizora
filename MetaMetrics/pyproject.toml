[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metametrics"
version = "1.0.0"
description = "Framework-independent Python library for the Meta Marketing API."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "MetaMetrics" }]
keywords = ["meta", "facebook", "marketing-api", "ads", "insights", "analytics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1.0",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
models = ["pydantic>=2.10,<3.0"]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=5.0,<7.0",
    "respx>=0.22,<1.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["metametrics"]

[tool.hatch.build.targets.sdist]
include = ["/metametrics", "/tests", "/README.md", "/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration' --strict-markers"
markers = [
    "integration: live Meta Marketing API tests; requires real credentials",
]

[tool.coverage.run]
source = ["metametrics"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "N",             # pep8-naming
    "UP",            # pyupgrade
    "B",             # bugbear
    "C4",            # comprehensions
    "SIM",           # simplify
    "RUF",           # ruff-specific
    "ANN",           # annotations
    "PTH",           # pathlib
    "TID",           # tidy imports
    "ARG",           # unused arguments
]
ignore = [
    "ANN401",  # Any is allowed at API boundaries where Meta payloads are dynamic
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "ARG", "S101"]

[tool.ruff.lint.isort]
known-first-party = ["metametrics"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
packages = ["metametrics"]
mypy_path = "."

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
